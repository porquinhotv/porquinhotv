  canal: sic
  programa: não apurado
  prova: https://poligrafo.sapo.pt/fact-check/andre-ventura-todas-as-sondagens-antes-das-legislativas-de-2024-davam-13-ou-14-ao-chega-mas-tivemos-18-dos-votos/
  titulo: 'André Ventura: "Todas as sondagens antes das legislativas de 2024 davam 13% ou 14% ao Chega, mas tivemos 18% dos votos" - Polígrafo'
  publicado_em: '2025-03-13'
