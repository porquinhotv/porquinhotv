---
# Clipping de imprensa. Prova de que a emissao existiu, e de quando.
#
# Uma linha por emissao provada por uma peca de imprensa. A `prova` e o
# URL da peca, e a peca tem de cumprir quatro condicoes, que quem abrir a
# ligacao consegue verificar:
#   1. nomeia o canal ("em entrevista a CMTV", nao "a televisao");
#   2. diz entrevista, e nao debate nem declaracoes;
#   3. fixa o dia da emissao (data, "ontem", "esta segunda-feira");
#   4. relata a entrevista ou anuncia-a com o dia fixado. O anuncio ("da
#      hoje entrevista as 19h") conta desde 2026-09-09, por decisao do
#      autor: uma entrevista anunciada a um canal raramente se cancela ou
#      adia. Ve-se que a prova e um anuncio porque `publicado_em` fica
#      anterior a `data`. Uma segunda peca, ou a pagina do canal, continua
#      a ser a melhor confirmacao, e ganha a esta quando existe.
#
# Ate 2026-09-08 esta fonte era o ultimo recurso, para o que o canal nao
# publicara. Deixou de ser: seis dos nove canais nao respondem a uma
# maquina e titulam as pecas com a citacao, e a imprensa e muitas vezes o
# unico rasto publico de que a entrevista existiu. Desde 2026-09-10 e
# exatamente isso que o site conta: a existencia, nunca o tempo. O site
# escreve "(imprensa)" ao lado da linha e publica a reparticao entre
# provas do canal e da imprensa.
#
# `data` e o dia da emissao; `publicado_em` e o dia da peca, quando e
# outro. Confundir os dois desloca a emissao um dia.
#
# Regra: se a mesma emissao aparecer aqui e em config/entrevistas.yml,
# fica a do canal, e esta vai para a quarentena como fragmento_ou_repetido.
# `python -m ferramentas.gnews --emitir --imprensa` escreve este ficheiro
# a partir da triagem e ja salta o que o registo do canal tem.
#
# Exemplo (apagar quando houver linhas reais):
#
#   - data: 2021-03-15
#     canal: cmtv
#     programa: Grande Jornal
#     prova: https://exemplo.pt/noticia-que-relata-a-entrevista
#     titulo: Entrevista relatada pela imprensa
#     publicado_em: 2021-03-16   # so se for outro dia

entrevistas:
