---
# Lista de referencia: emissoes que o autor sabe que existiram, por dia e
# canal. Escrita a 2026-09-10, a partir de uma lista dele de janeiro de
# 2024 a agosto de 2025, em que tem muita confianca.
#
# NAO E UMA FONTE. Nenhuma linha daqui entra no site: uma emissao so
# conta com uma prova publica que qualquer pessoa abre. A lista serve
# para duas coisas, as duas na ferramenta local:
#
#   python -m ferramentas.gnews --saida ... --dirigidas
#       pede ao indice de noticias so os dias a volta de cada linha, com
#       as consultas de `dirigidas` em config/gnews.yml. Uma janela de
#       poucos dias com o nome do canal e outra amostra do indice, mais
#       pequena, em que a peca certa tem mais hipotese de vir do que na
#       colheita mensal, que a 2026-09-08 nao trouxe 14 de 16 entrevistas
#       conhecidas.
#   python -m ferramentas.gnews --saida ... --cobertura
#       diz, linha a linha, se o site tem a emissao, se um registo em
#       ficheiro a tem por publicar, se a triagem tem uma pista, ou se nao
#       ha nada. E a reconciliacao desta lista contra o que se publica.
#
# A tolerancia de um dia existe porque a data de uma peca nao e a data
# da emissao, e porque a propria lista pode estar um dia ao lado: a linha
# "RTP 19 marco 2025" e a entrevista do Telejornal de terca-feira, 18,
# pela pagina do canal.
#
# Onde a lista dizia "TVI/ CNN" ha duas linhas, porque a decisao
# editorial 3 conta o simulcast nos dois canais. Onde dizia so "RTP"
# ficou rtp1, que e onde o Telejornal e as entrevistas eleitorais passam;
# a `busca-rtp1` e o registo tratam do rtp3 quando houver prova.
tolerancia_dias: 1

