---
# Sondagem de hipoteses. Corre a pedido, nao escreve dados do site.
#
# Serve para responder a duas perguntas sem adivinhar:
#
# 1. qual e o parametro de paginacao de cada site cuja pesquisa funciona
#    mas cujo URL da pagina 2 nao conhecemos;
# 2. que motor de busca, se algum, responde a um pedido feito da maquina
#    da CI sem muro de consentimento nem verificacao.
#
# Cada hipotese e um URL. A sonda pede, e regista: codigo de resposta,
# tamanho, se os termos aparecem no HTML servido, e quantas ligacoes de
# artigo do dominio alvo se conseguem colher. Uma hipotese que devolva
# 200 mas zero ligacoes e tao inutil como uma que devolva 403, e o
# relatorio mostra as duas coisas em vez de so o codigo.
#
# Nada aqui e configuracao de recolha: e uma experiencia. O que passar
# na sondagem e depois escrito a mao em config/fontes.yml.

# Substituido em cada URL. Uma consulta so, para a sondagem ser curta.
termo: 'ventura entrevista'

# Dominios que contam como resultado util quando a hipotese e um motor
# de busca. Vivem aqui e nao no codigo: nenhum modulo Python conhece o
# dominio de um canal, e ha um teste que falha se conhecer.
dominios_de_interesse: [rtp.pt, sic.pt, sicnoticias.pt, iol.pt, cmjornal.pt, nowcanal.pt, now.pt]

grupos:
  - nome: Paginacao dos sites que ja respondem
    # A pagina 1 e conhecida e responde. A pergunta e como se pede a 2.
    # Os nomes de parametro abaixo sao os correntes; o que devolver
    # ligacoes diferentes da pagina 1 e o certo.
    dominio_alvo: sic.pt
    hipoteses:
      - https://sic.pt/pesquisa?q={termo}
      - https://sic.pt/pesquisa?q={termo}&pagina=2
      - https://sic.pt/pesquisa?q={termo}&page=2
      - https://sic.pt/pesquisa?q={termo}&p=2
      - https://sic.pt/pesquisa?q={termo}&offset=10

  - nome: Paginacao SIC Noticias
    dominio_alvo: sicnoticias.pt
    hipoteses:
      - https://sicnoticias.pt/pesquisa?q={termo}
      - https://sicnoticias.pt/pesquisa?q={termo}&pagina=2
      - https://sicnoticias.pt/pesquisa?q={termo}&page=2
      - https://sicnoticias.pt/pesquisa?q={termo}&p=2
      - https://sicnoticias.pt/pesquisa?q={termo}&offset=10

  - nome: Paginacao CMTV
    dominio_alvo: cmjornal.pt
    hipoteses:
      - https://www.cmjornal.pt/pesquisa?q={termo}
      - https://www.cmjornal.pt/pesquisa?q={termo}&pagina=2
      - https://www.cmjornal.pt/pesquisa?q={termo}&page=2
      - https://www.cmjornal.pt/pesquisa?q={termo}&p=2

  - nome: Paginacao TVI e CNN (parametro ja conhecido, confirmar que muda)
    dominio_alvo: iol.pt
    hipoteses:
      - https://tvi.iol.pt/search?pagina=1&pesquisa={termo}
      - https://tvi.iol.pt/search?pagina=2&pesquisa={termo}
      - https://cnnportugal.iol.pt/search?pagina=1&pesquisa={termo}
      - https://cnnportugal.iol.pt/search?pagina=2&pesquisa={termo}

  - nome: As paginas dos canais respondem, ou nao
    # A pergunta decisiva. O motor de busca ja nos deu enderecos reais de
    # artigos da SIC Noticias, mas nunca chegamos a pedir nenhum deles: os
    # pedidos de pesquisa levaram 429 antes disso. Se as paginas de artigo
    # tambem recusarem, nenhuma estrategia de indice serve para esse canal,
    # e e melhor saber ja do que depois de outra corrida longa.
    dominio_alvo: ''
    hipoteses:
      - https://sicnoticias.pt/pais/2023-11-13-A-entrevista-a-Andre-Ventura-947f0b8a
      - https://sicnoticias.pt/pais/2024-01-13-Andre-Ventura-em-entrevista-a-SIC-Noticias-4b82221c
      - https://sicnoticias.pt/especiais/eleicoes-presidenciais/2025-10-24-andre-ventura-em-entrevista-exclusiva-a-sic-884d8388
      - https://www.cmjornal.pt/robots.txt
      - https://sic.pt/robots.txt

  - nome: Mapas do site e feeds, que sao servidos para maquinas
    # Um sitemap e um feed existem para serem lidos por programas, nao
    # apesar disso. Se responderem, sao melhor fonte do que qualquer
    # motor de busca: nao ha limite de ritmo, nao ha intermediario, e o
    # sitemap de noticias costuma cobrir anos.
    dominio_alvo: ''
    hipoteses:
      - https://sicnoticias.pt/robots.txt
      - https://sicnoticias.pt/sitemap.xml
      - https://sicnoticias.pt/rss
      - https://sicnoticias.pt/feed
      - https://www.cmjornal.pt/sitemap.xml
      - https://cnnportugal.iol.pt/sitemap.xml
      - https://tvi.iol.pt/sitemap.xml
      - https://www.rtp.pt/robots.txt

  - nome: Motor que embrulha os enderecos, agora desembrulhados
    # A sondagem anterior contou zero ligacoes neste motor porque ele nao
    # liga directamente ao destino: poe o endereco verdadeiro num
    # parametro do seu proprio URL de saida. Isso ja e desfeito, por isso
    # a contagem desta vez diz o que ele devolve mesmo.
    dominio_alvo: ''
    hipoteses:
      - https://lite.duckduckgo.com/lite/?q=site%3Asicnoticias.pt+{termo}
      - https://html.duckduckgo.com/html/?q=site%3Asicnoticias.pt+{termo}
      - https://lite.duckduckgo.com/lite/?q=site%3Asic.pt+{termo}

  - nome: Paginacao do motor escolhido
    # A sondagem de 2026-09-08 mostrou que este motor responde. Falta
    # saber se a paginacao funciona: duas paginas com ligacoes diferentes
    # sao paginacao, duas paginas iguais nao sao.
    dominio_alvo: ''
    hipoteses:
      - https://search.brave.com/search?q=site%3Asicnoticias.pt+{termo}
      - https://search.brave.com/search?q=site%3Asicnoticias.pt+{termo}&offset=1
      - https://search.brave.com/search?q=site%3Asicnoticias.pt+{termo}&offset=2
      - https://search.brave.com/search?q=site%3Asicnoticias.pt+{termo}&spellcheck=0&offset=1

  - nome: Motores de busca alternativos
    # A Google e inutilizavel a partir da CI: responde a maquinas de
    # datacenter com muro de consentimento ou verificacao. A pergunta e
    # se algum outro responde. Nenhum destes precisa de conta ou chave.
    # O dominio alvo nao se aplica: aqui conta so se a pagina responde e
    # se traz resultados no HTML servido.
    dominio_alvo: ''
    hipoteses:
      - https://html.duckduckgo.com/html/?q={termo}
      - https://lite.duckduckgo.com/lite/?q={termo}
      - https://www.mojeek.com/search?q={termo}
      - https://search.marginalia.nu/search?query={termo}
      - https://www.startpage.com/sp/search?query={termo}
      - https://search.brave.com/search?q={termo}
      - https://www.ecosia.org/search?q={termo}
      - https://searx.be/search?q={termo}
      - https://lite.duckduckgo.com/lite/?q=site%3Asicnoticias.pt+{termo}
      - https://www.mojeek.com/search?q=site%3Asicnoticias.pt+{termo}

  - nome: Indice proprio do jornal de fact-checking
    # Nove das onze linhas do clipping publicadas a 2026-09-09 vieram deste
    # jornal, atraves do RSS do indice de noticias. O indice nao traz tudo
    # o que existe (verificado a 2026-09-08), por isso a pergunta e se se
    # chega ao mesmo sitio pela porta da frente, e com que profundidade.
    #
    # O que ja se sabe, verificado a 2026-09-09 e nao suposto:
    #
    # - a data de publicacao le-se bem nas paginas deste jornal. Prova-o o
    #   proprio dataset: as nove linhas entraram com a data lida por
    #   "ontem", o que exige a data da peca. Nao ha aqui nada a sondar;
    # - a listagem `/ultimas/N/` e servida pelo servidor, sem JavaScript,
    #   com 24 itens por pagina e cerca de 561 paginas. Cada item traz
    #   ligacao, titulo e as primeiras linhas do lead, mas nao traz data;
    # - a pesquisa `?s=` devolve a entrada, nao resultados.
    #
    # Falta responder a tres coisas, e nenhuma se responde por raciocinio:
    #
    # 1. a listagem responde ao agente da ferramenta, a partir de casa, e
    #    tanto na primeira pagina como no fundo do arquivo? Uma listagem
    #    que responde na pagina 1 e falha na 500 nao serve para o historico,
    #    que e onde faltam linhas;
    # 2. o sitio corre WordPress (`meta-generator` diz Elementor). Se a API
    #    de leitura estiver aberta, devolve titulo, lead e data em JSON, 100
    #    por pedido, e dispensa percorrer 561 paginas de HTML. Se estiver
    #    fechada, percorre-se a listagem;
    # 3. existe um arquivo por pessoa, como ha por categoria? Se existir, o
    #    funil comeca ja filtrado em vez de peneirar treze mil pecas.
    #
    # Uma hipotese que responda 200 e traga zero ligacoes nao serve: e uma
    # pagina de aviso. E por isso que a sonda conta as duas coisas.
    dominio_alvo: poligrafo.sapo.pt
    hipoteses:
      - https://poligrafo.sapo.pt/ultimas/
      - https://poligrafo.sapo.pt/ultimas/2/
      - https://poligrafo.sapo.pt/ultimas/300/
      - https://poligrafo.sapo.pt/ultimas/561/
      - https://poligrafo.sapo.pt/wp-json/wp/v2/posts?per_page=5
      - https://poligrafo.sapo.pt/wp-json/wp/v2/posts?search=ventura&per_page=5
      - https://poligrafo.sapo.pt/wp-json/wp/v2/search?search=ventura&per_page=5
      - https://poligrafo.sapo.pt/tag/andre-ventura/
      - https://poligrafo.sapo.pt/autor/poligrafo/

  - nome: Caminho barato para as pecas do jornal de fact-checking
    # Segunda volta, depois da primeira sondagem a 2026-09-09:
    #
    # - a listagem responde e pagina a serio, do primeiro ao ultimo dos
    #   561 numeros, com 24 pecas por pagina. Cerca de 13.500 pecas;
    # - a API de leitura do WordPress responde 401 nas tres formas
    #   tentadas: esta fechada e nao ha por onde insistir sem conta;
    # - `/tag/andre-ventura/` da 404, mas o sitio poe as categorias sob
    #   `/blog/category/`, por isso o caminho das etiquetas pode ser outro.
    #
    # Percorrer 561 paginas para chegar a algumas dezenas de pecas e caro e
    # so se faz se nao houver melhor. Duas vias mais baratas por sondar:
    #
    # 1. o mapa do sitio. Um WordPress publica-o num destes caminhos e ele
    #    lista os enderecos todos com a data da ultima alteracao. Um
    #    endereco por peca, sem HTML de pagina a volta;
    # 2. o arquivo por etiqueta, se existir com outro prefixo.
    #
    # Porque o mapa do sitio pode chegar: as nove pecas deste jornal que
    # ja provam linhas publicadas tem todas o nome do sujeito no proprio
    # endereco. Se isso se confirmar em escala, filtra-se pelo endereco e
    # abrem-se algumas centenas de paginas em vez de treze mil. E uma
    # hipotese medida em nove casos, o que nao autoriza conclusao nenhuma
    # sobre o arquivo inteiro: e por isso que se sonda o mapa primeiro.
    dominio_alvo: poligrafo.sapo.pt
    hipoteses:
      - https://poligrafo.sapo.pt/sitemap_index.xml
      - https://poligrafo.sapo.pt/wp-sitemap.xml
      - https://poligrafo.sapo.pt/sitemap.xml
      - https://poligrafo.sapo.pt/post-sitemap.xml
      - https://poligrafo.sapo.pt/robots.txt
      - https://poligrafo.sapo.pt/blog/tag/andre-ventura/
      - https://poligrafo.sapo.pt/fact-checks/politica/

  - nome: Paginacao do arquivo de etiqueta do jornal de fact-checking
    # Terceira volta, 2026-09-09. A segunda respondeu duas coisas:
    #
    # - `post-sitemap.xml` existe e traz 374 KB de enderecos. As zero
    #   ligacoes nao sao uma falha: um mapa de sitio escreve `<loc>` e nao
    #   `href`, e a sonda conta ligacoes de HTML;
    # - `/blog/tag/andre-ventura/` responde. O 404 da volta anterior era do
    #   prefixo tentado, nao da falta de arquivo por pessoa.
    #
    # O arquivo de etiqueta e a via mais barata de todas, se paginar: em
    # vez de treze mil pecas ou de filtrar um mapa pelo endereco, o funil
    # comeca ja filtrado pelo proprio jornal. Falta saber duas coisas, e as
    # duas se veem aqui: qual e a forma da pagina dois, e ate onde vai.
    #
    # Duas paginas com as mesmas ligacoes nao sao paginacao. Uma que
    # responda 200 com o numero de ligacoes de uma pagina vazia tambem nao.
    dominio_alvo: poligrafo.sapo.pt
    hipoteses:
      - https://poligrafo.sapo.pt/blog/tag/andre-ventura/
      - https://poligrafo.sapo.pt/blog/tag/andre-ventura/page/2/
      - https://poligrafo.sapo.pt/blog/tag/andre-ventura/2/
      - https://poligrafo.sapo.pt/blog/tag/andre-ventura/page/5/
      - https://poligrafo.sapo.pt/blog/tag/andre-ventura/page/20/
      - https://poligrafo.sapo.pt/blog/tag/andre-ventura/page/60/

  # ==================================================================
  # Quarta volta, 2026-09-10. Vias de acesso ao historico de 2019 a
  # 2023, que e onde o indice de noticias nao chega (0 candidatos em
  # 2019, 3 em 2020, 1 em 2021, 13 em 2022, 1 em 2023). Nenhuma destas
  # foi ainda pedida a um servidor; sao hipoteses, e a sonda diz.
  #
  # Grupos com `mostrar: true` imprimem a amostra do texto na consola e
  # guardam-na no relatorio: e para ler um robots.txt ou as primeiras
  # linhas de um indice sem outro pedido.
  # ==================================================================

  - nome: Arquivo da web, o indice
    # Segunda volta, 2026-09-10, depois de a primeira ter medido mal por
    # duas razoes, ambas verificadas na amostra que a sonda guardou:
    #
    # 1. o filtro `.*ventura.*` casava com "aventura". Na amostra do
    #    primeiro dominio apareciam "uma aventura muito intensa" e "acao
    #    aventura e muita animacao". E a armadilha do nome dentro de
    #    outro nome, ja escrita na seccao 7 da KB a proposito de
    #    "Boaventura", agora num filtro por endereco. Passa a exigir o
    #    nome proprio e o apelido juntos, com maiuscula ou minuscula,
    #    separados por hifen ou por sublinhado, que e como os sitios
    #    escrevem um nome num endereco;
    # 2. cinco de nove consultas passaram dos 30 s e leram-se como "nao
    #    responde". Uma consulta que varre um dominio inteiro com filtro
    #    e cara do lado de la: o grupo pede 180 s por pedido.
    #
    # Uma terceira coisa que a primeira volta mostrou: um dominio bateu
    # nos 200 do `limit`, ou seja, a resposta estava truncada e o numero
    # nao era o numero. Duas janelas em vez de uma e `limit` a 1000.
    #
    # Ler assim: enderecos declarados por dominio e por janela. Zero num
    # dominio quer dizer que o arquivo nao o cobre, ou que os enderecos
    # desse canal nao nomeiam o sujeito; a amostra distingue as duas
    # coisas. O `robots.txt` do arquivo devolveu 404 a 2026-09-10, o que
    # quer dizer que nao pede ritmo nenhum.
    dominio_alvo: ''
    mostrar: true
    tempo_limite_s: 180
    hipoteses:
      - https://web.archive.org/cdx/search/cdx?url=sicnoticias.pt/*&filter=original:.*[Aa]ndre[-_][Vv]entura.*&from=2019&to=2021&fl=timestamp,original,statuscode&collapse=urlkey&limit=1000
      - https://web.archive.org/cdx/search/cdx?url=sicnoticias.pt/*&filter=original:.*[Aa]ndre[-_][Vv]entura.*&from=2022&to=2023&fl=timestamp,original,statuscode&collapse=urlkey&limit=1000
      - https://web.archive.org/cdx/search/cdx?url=sic.pt/*&filter=original:.*[Aa]ndre[-_][Vv]entura.*&from=2019&to=2023&fl=timestamp,original,statuscode&collapse=urlkey&limit=1000
      - https://web.archive.org/cdx/search/cdx?url=cnnportugal.iol.pt/*&filter=original:.*[Aa]ndre[-_][Vv]entura.*&from=2019&to=2021&fl=timestamp,original,statuscode&collapse=urlkey&limit=1000
      - https://web.archive.org/cdx/search/cdx?url=cnnportugal.iol.pt/*&filter=original:.*[Aa]ndre[-_][Vv]entura.*&from=2022&to=2023&fl=timestamp,original,statuscode&collapse=urlkey&limit=1000
      - https://web.archive.org/cdx/search/cdx?url=tvi.iol.pt/*&filter=original:.*[Aa]ndre[-_][Vv]entura.*&from=2019&to=2021&fl=timestamp,original,statuscode&collapse=urlkey&limit=1000
      - https://web.archive.org/cdx/search/cdx?url=tvi.iol.pt/*&filter=original:.*[Aa]ndre[-_][Vv]entura.*&from=2022&to=2023&fl=timestamp,original,statuscode&collapse=urlkey&limit=1000
      - https://web.archive.org/cdx/search/cdx?url=tviplayer.iol.pt/*&filter=original:.*[Aa]ndre[-_][Vv]entura.*&from=2019&to=2023&fl=timestamp,original,statuscode&collapse=urlkey&limit=1000
      - https://web.archive.org/cdx/search/cdx?url=cmjornal.pt/*&filter=original:.*[Aa]ndre[-_][Vv]entura.*&from=2019&to=2023&fl=timestamp,original,statuscode&collapse=urlkey&limit=1000
      - https://web.archive.org/cdx/search/cdx?url=rtp.pt/play/*&filter=original:.*[Aa]ndre[-_][Vv]entura.*&from=2019&to=2023&fl=timestamp,original,statuscode&collapse=urlkey&limit=1000
      - https://web.archive.org/cdx/search/cdx?url=rtp.pt/noticias/*&filter=original:.*[Aa]ndre[-_][Vv]entura.*&from=2019&to=2023&fl=timestamp,original,statuscode&collapse=urlkey&limit=1000

  - nome: Arquivo da web, uma pagina que a maquina nao le
    # As 233 linhas "por ler" sao paginas da SIC e do Expresso que
    # recusam a maquina, tambem a partir de casa. O arquivo da web pode
    # ter uma copia, e a copia com `id_` no carimbo e o HTML original
    # sem a moldura do arquivo, com o schema.org e o OpenGraph intactos.
    # Se a copia responder e trouxer os termos, o `--verificar` pode
    # cair para o arquivo quando a pagina nao responde, e a prova
    # publicada continua a ser o endereco original, que qualquer pessoa
    # abre no browser.
    #
    # A primeira hipotese pergunta ao arquivo se tem copia e qual; as
    # duas seguintes pedem a copia mais proxima de uma data. Os
    # enderecos sao de paginas que a sonda de 2026-09-08 ja tinha
    # listado ou que estao no registo curado.
    dominio_alvo: ''
    mostrar: true
    hipoteses:
      - https://archive.org/wayback/available?url=sicnoticias.pt/pais/2023-11-13-A-entrevista-a-Andre-Ventura-947f0b8a
      - https://web.archive.org/web/2024id_/https://sicnoticias.pt/pais/2023-11-13-A-entrevista-a-Andre-Ventura-947f0b8a
      - https://web.archive.org/web/2026id_/https://sicnoticias.pt/especiais/eleicoes-presidenciais/2025-10-24-andre-ventura-em-entrevista-exclusiva-a-sic-884d8388

  - nome: Indice de etiqueta da CNN
    # Verificado a 2026-09-09 que existe, pagina a serio, e servido pelo
    # servidor, com ligacao, titulo, data e duracao por item, ate
    # outubro de 2019. E a melhor via conhecida para 2019 a 2023 e nunca
    # foi pedida por esta ferramenta. O que falta saber, e que se ve
    # aqui: o que o robots.txt pede, se a primeira e a ultima pagina
    # respondem a esta maquina com ligacoes de artigo, e se o mapa do
    # sitio (que a 2026-09-08 respondeu com 4320 bytes e contou zero
    # porque so se contavam `href`) declara enderecos.
    #
    # Atencao ao ler: uma pagina que responda 200 com zero ligacoes de
    # artigo e montada por JavaScript, como a pesquisa deste sitio.
    # E o canal nao se deduz do dominio (ver a KB, seccao 7): este
    # indice mistura o arquivo da antiga TVI24 e videos servidos aos
    # dois canais do grupo.
    dominio_alvo: cnnportugal.iol.pt
    mostrar: true
    hipoteses:
      - https://cnnportugal.iol.pt/robots.txt
      - https://cnnportugal.iol.pt/noticias/Andre-ventura?pagina=1
      - https://cnnportugal.iol.pt/noticias/Andre-ventura?pagina=2
      - https://cnnportugal.iol.pt/noticias/Andre-ventura?pagina=146
      - https://cnnportugal.iol.pt/sitemap.xml

  - nome: SIC, o que o robots diz e onde vive o mapa
    # A 2026-09-08 o robots.txt da SIC Noticias respondeu 200 com 2340
    # bytes, e ninguem leu o que dizia. Um robots.txt costuma declarar
    # onde esta o mapa do sitio, e o mapa pode responder onde a pesquisa
    # e o RSS responderam 403. Ler primeiro, pedir depois.
    dominio_alvo: ''
    mostrar: true
    hipoteses:
      - https://sicnoticias.pt/robots.txt
      - https://sic.pt/robots.txt

  - nome: Motor com porta RSS
    # MEDIDO E RECUSADO a 2026-09-10: as dez consultas responderam com
    # cerca de 4,2 KB cada e zero ligacoes para qualquer dominio de
    # interesse. Os termos que a sonda encontrou no texto sao o eco da
    # propria consulta, que e a assinatura de uma pagina de aviso, a
    # mesma do Startpage a 2026-09-08. A porta existe e nao devolve
    # resultados a esta maquina. Fica aqui para nao voltar a ser
    # tentado; nao correr outra vez sem uma razao nova.
    #
    # O indice de noticias da Google tem uma porta RSS que responde a
    # maquinas onde a pagina normal recusa, e foi essa porta que
    # reconstruiu o historico. Um motor concorrente tem a mesma porta
    # (`format=rss`), sem conta nem chave, e indexa os sitios dos canais
    # que a Google indexa. Nunca foi pedido. Se responder com ligacoes
    # dos dominios de interesse, e uma segunda amostra do mesmo tipo de
    # indice, e a licao de 2026-09-10 diz que cada amostra traz linhas
    # que a outra nao traz.
    #
    # Testar na dimensao em que se vai usar: sao dez pedidos seguidos,
    # de proposito, para ver se o decimo responde como o primeiro.
    dominio_alvo: ''
    hipoteses:
