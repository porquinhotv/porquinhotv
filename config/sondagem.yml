    # de recolha para modelos de linguagem; o `User-agent: *` proibe
    # `/api`, `/sites`, `/sandbox`, `/hotfolder-video-exports` e
    # `/pesquisa`, e acaba em `Allow: /`. Os 403 que este projeto
    # apanhou em setembro foram todos na pesquisa, que e precisamente o
    # unico caminho de conteudo que o site pede para nao tocar. E o
    # ficheiro declara tres mapas, um deles so de videos.
    #
    # Duas perguntas, e as duas se veem aqui:
    #
    # 1. os mapas respondem, e quanto trazem? O de videos interessa mais
    #    do que o de noticias, porque uma entrevista de canal e um video.
    #    A coluna dos enderecos declarados e a que conta; um mapa de
    #    indice traz mapas, nao pecas, e por isso a amostra importa;
    # 2. uma pagina de artigo responde a esta maquina a partir de casa?
    #    A 2026-09-08 a resposta da CI foi 403 para tudo. De casa nunca
    #    foi perguntado, e a copia arquivada da primeira destas paginas
    #    respondeu a 2026-09-10, o que prova que a pagina existe e e
    #    legivel. Se as tres responderem ao vivo, a SIC deixa de precisar
