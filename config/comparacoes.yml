---
# Comparacoes de tempo. A piada e uma divisao: tempo medido a dividir por
# uma duracao de referencia, arredondado para baixo. Nada e inventado.
#
# Referencias por definicao (um jogo de futebol tem 90 minutos) aguentam
# contestacao. Quando a referencia e aproximada, `aproximada: true` e a
# frase ganha "cerca de". A `nota` diz de onde vem o numero.
#
# Templates: {n} numero de unidades, {unidade} singular ou plural ja
# escolhido, {canal} nome do canal, {tempo} duracao legivel.

frases:
  total: 'Ao todo, {tempo} de entrevistas exclusivas. Dava para {comparacao}.'
  canal: 'Na {canal}, {tempo} de entrevistas exclusivas. Dava para {comparacao}.'
  periodo: '{tempo} de entrevistas exclusivas {periodo}. Dava para {comparacao}.'
  nenhuma: 'nem {artigo} {um}'
  uma: '{artigo} {um}'
  varias: '{n} {varios}'
  aproximada: 'cerca de {n} {varios}'

comparacoes:
  - id: futebol
    unidade_s: 5400
    artigo: um
    um: jogo de futebol de 90 minutos
    varios: jogos de futebol de 90 minutos
    nota: por definição, sem prolongamento
  - id: cinema
    unidade_s: 7200
    artigo: uma
    um: sessão de cinema de duas horas
    varios: sessões de cinema de duas horas
    nota: por definição
  - id: sesta
    unidade_s: 1200
    artigo: uma
    um: sesta de 20 minutos
    varios: sestas de 20 minutos
    nota: por definição
  - id: novela
    unidade_s: 2700
    artigo: um
    um: episódio de telenovela de 45 minutos
    varios: episódios de telenovela de 45 minutos
    nota: por definição
  - id: aula
    unidade_s: 3000
    artigo: uma
    um: aula de 50 minutos
    varios: aulas de 50 minutos
    nota: por definição
  - id: maratona
    unidade_s: 14400
    artigo: uma
    um: maratona a passo de quatro horas
    varios: maratonas a passo de quatro horas
    nota: por definição, a passo de quatro horas
  - id: sono
    unidade_s: 28800
    artigo: uma
    um: noite de sono de oito horas
    varios: noites de sono de oito horas
    nota: por definição
  - id: semana-trabalho
    unidade_s: 144000
    artigo: uma
    um: semana de trabalho de 40 horas
    varios: semanas de trabalho de 40 horas
    nota: por definição
  - id: dia-inteiro
    unidade_s: 86400
    artigo: um
    um: dia inteiro de televisão, sem intervalos
    varios: dias inteiros de televisão, sem intervalos
    nota: por definição, 24 horas
  - id: comboio
    unidade_s: 10800
    aproximada: true
    artigo: uma
    um: viagem de comboio Lisboa a Porto
    varios: viagens de comboio Lisboa a Porto
    nota: aproximada, o serviço mais rápido anuncia perto de três horas
  - id: voo
    unidade_s: 28800
    aproximada: true
    artigo: um
    um: voo Lisboa a Nova Iorque
    varios: voos Lisboa a Nova Iorque
    nota: aproximada, cerca de oito horas
