# Curadoria a mao. Duas listas, e as duas sao decisoes de uma pessoa que
# abriu a pagina. E o unico sitio do projeto onde uma pessoa acrescenta ou
# retira uma emissao diretamente.
#
# ------------------------------------------------------------------
# entrevistas: acrescentar uma emissao
# ------------------------------------------------------------------
# Basta o dia, o canal e a prova. Tudo o resto e opcional.
#
#   - data: 2021-03-15         # dia da emissao, obrigatorio
#     canal: cmtv              # id de config/porquinho.yml, obrigatorio
#     prova: https://...       # pagina do canal OU noticia, obrigatorio
#     origem: imprensa         # opcional: "imprensa" se a prova for uma
#                              # noticia; por omissao "canal"
#     programa: Grande Jornal  # opcional; sem ele fica "nao apurado"
#     titulo: ...              # opcional
#     publicado_em: 2021-03-16 # opcional; so se a peca for de outro dia
#     mesma_entrevista: chave  # opcional; agrupa simulcast e repeticoes
#
# Esta fonte corre a frente de todas as outras e salta a prova positiva
# de formato e as rondas de confirmacao, pela mesma razao que o registo
# curado: uma pessoa leu a pagina. A isencao corresponde a justificacao.
#
# Nao ha campo de duracao. O site conta a existencia da entrevista.
#
# ------------------------------------------------------------------
# remover: uma prova que nao conta
# ------------------------------------------------------------------
# Aplica-se ao que qualquer fonte devolver e tambem ao que ja esta
# publicado. A linha removida vai para a quarentena com este motivo
# escrito, e continua visivel la: **nada e descartado em silencio**.
#
#   - prova: https://...
#     motivo: e um debate, nao uma entrevista
#
# O motivo e obrigatorio. Uma remocao sem motivo e indistinguivel de um
# engano, e daqui a seis meses ninguem sabe qual das duas foi.
#
# Isto fura a regra do append-only de proposito: o dataset e append-only
# para que uma linha nao desapareca quando a fonte deixa de a devolver, e
# uma remocao a mao e o contrario, alguem a afirmar que a linha esta
# errada. Esta escrito na Metodologia, na seccao das correcoes.

entrevistas:
  # Tres linhas da lista de referencia de 2026-09-10 (config/referencia.yml)
  # com prova aberta e lida nesse dia. As restantes ficam para a colheita
  # dirigida: uma pessoa nao le cinquenta paginas.
  - data: 2024-10-10
    canal: cnn-portugal
    origem: imprensa
    prova: https://www.dn.pt/ventura-diz-que-montenegro-propos-acordo-sobre-oe-com-promessa-de-integrar-governo-pm-desmente
    titulo: 'Ventura diz que Montenegro propôs acordo sobre OE com promessa de integrar Governo. PM desmente'
    # A peca, publicada as 19:56 desse dia, diz "esta quinta-feira, em
    # entrevista à CNN". O registo curado tem a mesma noite na TVI, com a
    # prova no leitor do grupo; a chave junta as duas como uma entrevista.
    mesma_entrevista: '2024-10-10'
  - data: 2025-03-18
    canal: rtp1
    programa: Telejornal
    prova: https://www.rtp.pt/noticias/politica/andre-ventura-diz-nunca-e-nunca-a-montenegro-e-assume-cada-vez-menos-esperanca-no-psd_n1641739
    titulo: 'André Ventura diz "nunca é nunca" a Montenegro e assume "cada vez menos esperança" no PSD'
    # A lista dizia 19 de marco. A pagina do canal, publicada a 18 as
    # 20:15, diz "o entrevistado da noite de terça-feira no Telejornal",
    # e 18 de marco de 2025 foi terca-feira. Fica a data do canal.
    mesma_entrevista: '2025-03-18'
  - data: 2025-04-11
    canal: rtp3
    programa: '360'
    prova: https://www.rtp.pt/noticias/pais/entrevista-rtp-ventura-quer-apoiar-jovens-com-corte-de-desperdicios-na-saude_v1647537
    titulo: 'Entrevista RTP. Ventura quer apoiar jovens com corte de "desperdícios" na Saúde'

remover:
  - prova: https://www.jm-madeira.pt/v%C3%ADdeo/regi-o/30004362/ventura-agarra-se-a-vice-presidente-da-camara-do-funchal.html
    motivo: é a mesma entrevista da emissão de 2026-09-01 na CNN Portugal, já provada pela página do canal; a data desta peça é a da publicação, não a da emissão
