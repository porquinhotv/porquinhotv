# ------------------------------------------------------------------
# mesma_entrevista: duas transmissoes, uma entrevista
# ------------------------------------------------------------------
# Desde 2026-09-11 a unidade do site e a entrevista exclusiva, e deixou
# de ser cada passagem num canal. Quando a mesma entrevista passa em dois
# canais, conta uma vez,
# fica atribuida a um deles, e o site escreve ao lado que passou tambem no
# outro.
#
#   - chave: 2025-03-17              # nome do grupo, unico, livre
#     canal: cnn-portugal            # a que canal a entrevista fica atribuida
#     motivo: ...                    # porque e a mesma, e quem o leu
#     provas:                        # os enderecos das transmissoes
#       - https://...
#       - https://...
#
# Tres regras, e cada uma foi paga:
#
# 1. **O `canal` escreve-se sempre. Nao ha regra que o adivinhe.** O canal
#    nao se le do dominio (8 linhas erradas em 8, ver a KB 6.1) e o
#    identificador de video partilhado levanta a suspeita mas nao a
#    resolve. Atribuir uma entrevista a um canal e uma afirmacao de quem
#    leu a pagina.
#
# 2. **O `motivo` escreve-se sempre, e diz se alguem leu.** Um
#    agrupamento sem motivo e indistinguivel de um descuido daqui a seis
#    meses, e e ele que distingue um simulcast provado de um agrupamento
#    herdado por confirmar.
#
# 3. **Agrupar e uma afirmacao positiva.** Sem entrada aqui, cada
#    transmissao e uma entrevista. Nunca se deduz um grupo de dois
#    enderecos parecidos nem de uma data igual.
#
# Quando as duas transmissoes partilham a mesma pagina (o mesmo video
# servido nos dois dominios do grupo), basta escrever o endereco uma vez.
# A corrida avisa na consola se um grupo escrito aqui nao chegou a juntar
# duas transmissoes: e como se apanha um endereco mal copiado.

