---
# Registo curado de transmissoes. A fonte principal do Porquinho TV.
#
# Cada linha e o facto de uma entrevista exclusiva ter passado num canal,
# verificado por uma pessoa, com o URL onde qualquer outra pessoa a pode
# ver. Sem prova nao entra.
#
# A unidade que o site conta e a entrevista, nao a linha: quando a mesma
# entrevista passa em dois canais ha duas linhas aqui e uma entrevista no
# site. Quem as junta e a tabela `mesma_entrevista` de
# config/curadoria.yml, que diz tambem a que canal a entrevista fica
# atribuida. Nao ha duracao: desde 2026-09-10 o site conta a existencia
# de cada entrevista e nunca o tempo, e o coletor recusa uma linha que
# ainda traga `duracao_s` ou `parcial`.
#
# Campos:
#   data             dia em que passou (AAAA-MM-DD)          obrigatorio
#   canal            id de config/porquinho.yml              obrigatorio
#   programa         nome do programa ou noticiario           obrigatorio
#   prova            URL do video ou da pagina do canal        obrigatorio
#   titulo           como o canal lhe chamou                   opcional
#   publicado_em     data de publicacao, se diferente          opcional
#
# O campo `mesma_entrevista` saiu daqui a 2026-09-11 e passou para a
# tabela com o mesmo nome em config/curadoria.yml. O coletor recusa uma
# linha que ainda o traga: um campo que ficasse aqui a fingir que agrupa
# deixava duas entrevistas a contar onde ha uma.
#
# Exemplo (apagar quando houver linhas reais):
#
#   - data: 2026-09-04
#     canal: sic-noticias
#     programa: Jornal da Noite
#     prova: https://sicnoticias.pt/.../entrevista-a-...
#     titulo: Entrevista a André Ventura

