    max_candidatos: 40
    paginas_max: 1

  - id: busca-sic-noticias
    tipo: busca_site
    ativa: true
    canal: sic-noticias
    dominio: sicnoticias.pt
    confianca: media
    busca:
      - https://sicnoticias.pt/pesquisa?q={termo}
