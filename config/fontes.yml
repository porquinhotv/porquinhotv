    canal: tvi
    dominio: iol.pt
    confianca: media
    busca:
      - https://tvi.iol.pt/pesquisa/{termo}
    max_candidatos: 40
    paginas_max: 1

  - id: busca-cnn-portugal
    tipo: busca_site
    ativa: true
    canal: cnn-portugal
    dominio: iol.pt
    confianca: media
    busca:
      - https://cnnportugal.iol.pt/pesquisa/{termo}
    max_candidatos: 40
    paginas_max: 1

  - id: busca-cmtv
    tipo: busca_site
    ativa: true
    canal: cmtv
    dominio: cmjornal.pt
    confianca: media
    busca:
      - https://www.cmjornal.pt/pesquisa?q={termo}
