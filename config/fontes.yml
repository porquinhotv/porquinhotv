---
# De onde vem a informacao. As fontes correm por esta ordem.
#
# Tipos:
#   manual        registo verificado a mao, com prova (URL) em cada linha.
#                 Ha duas: o registo do canal (config/entrevistas.yml),
#                 que e a fonte principal, e o clipping de imprensa
#                 (config/clipping.yml), que e o ultimo recurso e corre
#                 depois. Quando as duas cobrem a mesma emissao, fica a
#                 do canal.
#   podcast_rss   feed RSS de podcast: da duracao e data. Entra sozinho se
#                 o criterio deixar. Usar `segmentos` quando o feed mistura
#                 programas; `formato` diferente de "entrevista" exclui.
#   youtube_feed  feed Atom publico de um canal de YouTube, sem conta nem
#                 chave. Nao da duracao: os itens em que o nome e a prova
#                 de formato aparecem vao para a quarentena como
#                 `por_confirmar`, para passar a mao ao registo curado;
#                 os que nao dizem que sao entrevista ficam como
#                 `formato_nao_apurado`. E um detetor, nao um medidor.
#
# Antes de ativar uma fonte nova: --dry-run, ler a quarentena, contar os
# motivos, ler dez titulos aceites a mao contra o criterio. Depois ativar.

fontes:
  - id: registo-curado
    tipo: manual
    ativa: true
    ficheiro: config/entrevistas.yml
    origem: canal
    confianca: alta
    # Verificado a mao, com prova: pode registar uma emissao cuja duracao
    # nao foi possivel apurar. O evento conta, o tempo nao.
    duracao_opcional: true

  # Clipping de imprensa escrita. Ultimo recurso, para as emissoes que o
  # canal nunca publicou ou ja retirou. Uma peca que diga que no dia X
  # houve entrevista exclusiva no canal Y e prova do evento; raramente
  # traz duracao. Corre depois do registo do canal de proposito.
  - id: clipping-imprensa
    tipo: manual
    ativa: true
    ficheiro: config/clipping.yml
    origem: imprensa
    confianca: media
    duracao_opcional: true

  # ------------------------------------------------------------------
  # Pesquisa do proprio site. A fonte automatica principal.
  #
  # Cada fonte pede a pagina de pesquisa do site, colhe os URL de artigo
  # do mesmo dominio e le os dados estruturados (schema.org, OpenGraph)
  # de cada um. Nao ha seletores CSS: o que se le e o que os sites
  # publicam para os motores de busca, que e o que sobrevive as
  # remodelacoes.
  #
  # `busca` aceita {termo} (cada termo de deteccao do sujeito, ja
  # codificado) e {pagina} (1 ate paginas_max). Sem {pagina}, uma so.
  # `padrao_artigo` aperta o que conta como URL de artigo; vazio usa a
  # heuristica generica (dois segmentos de caminho e um slug com hifen).
  #
  # Para o historico: subir paginas_max. Cada pagina a mais sao mais
  # pedidos, por isso o valor de todos os dias e baixo de proposito, e a
  # corrida de historico corre com --paginas para o subir sem editar
  # isto.
  # ------------------------------------------------------------------
  # --- Pesquisa do proprio canal, onde ela responde ao servidor -------
  #
  # Sondado em 2026-09-08. So a RTP Play e a TVI passam. As restantes
  # ficam registadas aqui com o motivo, porque saber o que foi tentado e
  # porque falhou faz parte do metodo e evita voltar a tentar.
  #
  #   SIC e SIC Noticias   403 em todos os pedidos, tambem com cabecalho
  #                        de browser. E a defesa do alojamento a maquinas
  #                        de datacenter, nao o User-Agent.
  #   CMTV                 responde 200 e devolve sempre as mesmas 28
  #                        ligacoes, todas de navegacao, com qualquer
  #                        parametro de pagina: os resultados sao montados
  #                        por JavaScript e nao existem no HTML servido.
  #   CNN Portugal         responde 200 e zero ligacoes de artigo, pela
  #                        mesma razao. Os termos que aparecem no texto
  #                        sao o eco da caixa de pesquisa.
  #   RTP noticias         a pesquisa e Google Custom Search: tudo o que
  #                        interessa vai depois do # e nunca chega ao
  #                        servidor.
  #   NOW                  o site nao tem pesquisa.

  - id: busca-rtp1
    tipo: busca_site
    ativa: true
    canal: rtp1
    dominio: rtp.pt
    confianca: media
    busca:
      - https://www.rtp.pt/play/pesquisa?q={termo}
      - https://www.rtp.pt/play/pesquisa?q={termo}%20entrevista
    padrao_artigo: '/play/p[0-9]+/e[0-9]+/'
    max_candidatos: 300
    paginas_max: 1

  - id: busca-tvi
    tipo: busca_site
    ativa: true
    canal: tvi
    dominio: tvi.iol.pt
    confianca: media
    # Confirmado na sondagem: pagina 1 e pagina 2 devolvem ligacoes
    # diferentes, logo a paginacao e real. O site nao se queixou do
    # ritmo, por isso a pausa fica na de omissao.
    termos_busca: ['André Ventura']
    busca:
      - https://tvi.iol.pt/search?pagina={pagina}&pesquisa={termo}+entrevista
    max_candidatos: 400
    paginas_max: 12

  # --- Motor de busca externo, para os canais cuja pesquisa nao serve --
  #
  # A consulta leva `site:` do dominio do canal, e so entram ligacoes
  # desse dominio: o motor e um indice para chegar a pagina do canal, e a
  # prova de cada linha continua a ser o URL do canal, nunca o do motor.
  #
  # Sondado em 2026-09-08: de dez motores testados, o Brave foi o unico
  # que respondeu com resultados utilizaveis a partir da maquina da CI, e
  # os primeiros que devolveu eram exactamente entrevistas do sujeito na
  # RTP e na SIC Noticias. Nao exige conta nem chave. O DuckDuckGo
  # responde mas embrulha os endereços num redireccionamento proprio, por
  # isso a sondagem nao os contou; fica por esclarecer, nao por excluir.
  #
  # `termos_busca` reduz cada canal a uma consulta so: tres consultas por
  # canal seriam tres vezes mais pedidos a um servico que nos pode
  # limitar, sem tres vezes mais resultados.
  #
  # Sondagem de 2026-09-08: com quatro pedidos, offset=0 e offset=1
  # devolveram vinte ligacoes diferentes cada. Mas a primeira corrida de
  # historico a serio, com trinta pedidos, levou 429 em quase todos, mesmo
  # com oito segundos de pausa e recuos de 20, 60 e 120 segundos: tres
  # canais ficaram a zero. O motor nao aguenta o volume que precisamos a
  # partir de uma maquina de datacenter.
  #
  # Fica como suplemento, nao como fonte principal: uma pagina por canal
  # e trinta segundos de pausa, o que da seis pedidos por ronda em vez de
  # trinta. Vinte resultados por canal, escolhidos por relevancia, e
  # pouco para o historico mas util todos os dias.

  - id: motor-sic
    tipo: busca_site
    ativa: true
    canal: sic
    dominio: sic.pt
    confianca: media
    termos_busca: ['André Ventura entrevista']
    busca:
      - https://search.brave.com/search?q=site%3Asic.pt+{termo}&offset={pagina0}
    max_candidatos: 200
    paginas_max: 1
    pausa_s: 30

  - id: motor-sic-noticias
    tipo: busca_site
    ativa: true
    canal: sic-noticias
    dominio: sicnoticias.pt
    confianca: media
    termos_busca: ['André Ventura entrevista']
    busca:
      - https://search.brave.com/search?q=site%3Asicnoticias.pt+{termo}&offset={pagina0}
    max_candidatos: 200
    paginas_max: 1
    pausa_s: 30

  - id: motor-cnn-portugal
    tipo: busca_site
    ativa: true
    canal: cnn-portugal
    dominio: cnnportugal.iol.pt
    confianca: media
    termos_busca: ['André Ventura entrevista']
    busca:
      - https://search.brave.com/search?q=site%3Acnnportugal.iol.pt+{termo}&offset={pagina0}
    max_candidatos: 200
    paginas_max: 1
    pausa_s: 30

  - id: motor-cmtv
    tipo: busca_site
    ativa: true
    canal: cmtv
    dominio: cmjornal.pt
    confianca: media
    termos_busca: ['André Ventura entrevista CMTV']
    busca:
      - https://search.brave.com/search?q=site%3Acmjornal.pt+{termo}&offset={pagina0}
    padrao_artigo: '/cmtv/'
    max_candidatos: 200
    paginas_max: 1
    pausa_s: 30

  - id: motor-rtp3
    tipo: busca_site
    ativa: true
    canal: rtp3
    dominio: rtp.pt
    confianca: media
    termos_busca: ['André Ventura entrevista RTP3']
    busca:
      - https://search.brave.com/search?q=site%3Artp.pt+{termo}&offset={pagina0}
    padrao_artigo: '/noticias/'
    max_candidatos: 200
    paginas_max: 1
    pausa_s: 30

  - id: motor-now
    tipo: busca_site
    ativa: true
    canal: now
    dominio: now.pt
    confianca: media
    termos_busca: ['André Ventura entrevista']
    busca:
      - https://search.brave.com/search?q=site%3Anow.pt+{termo}&offset={pagina0}
    max_candidatos: 200
    paginas_max: 1
    pausa_s: 30

