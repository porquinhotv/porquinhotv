---
# Configuracao editorial do Porquinho TV.
#
# Tudo o que decide o que conta esta neste ficheiro e em fontes.yml.
# Nenhum modulo Python conhece nomes de canais, programas ou pessoas.
#
# Critério de inclusao (a Metodologia diz o mesmo por palavras):
#   conta como emissao uma entrevista exclusiva, ou seja, um segmento em
#   que o sujeito e o unico entrevistado, com pelo menos um entrevistador
#   do canal em formato de pergunta e resposta, emitido num dos canais
#   abaixo. Programas de entretenimento com entrevista a solo contam.
#   Debates, painéis, declaracoes a imprensa e diretos de eventos nao
#   contam.
#
#   O que se conta e a existencia da entrevista, provada por uma pagina
#   publica: a do canal ou uma noticia que a relata ou anuncia. Nao ha
#   duracao (retirada a 2026-09-10) nem duracao minima: o que separa
#   entrevista de declaracao e o formato, nao o relogio.
#
# Unidade: a emissao. A mesma entrevista emitida em dois canais sao duas
# emissoes (mostra presenca por canal). O campo `mesma_entrevista` no
# registo curado agrupa-as, e o site tambem mostra entrevistas distintas.

versao: 1

tema:
  id: entrevistas
  nome: Entrevistas exclusivas
  pergunta: Quantas entrevistas exclusivas deu André Ventura na televisão portuguesa?
  # Data da publicacao em Diario da Republica da inscricao do partido
  # (2.a serie, n.o 94, 16 de maio de 2019). Nada anterior entra.
  desde: '2019-05-16'
  desde_rotulo: desde a fundação do partido
  # Rondas distintas em que um bloco tem de ser visto antes de entrar no
  # dataset publicado. Protege de um erro transitorio da recolha (pagina
  # truncada, JSON-LD malformado nesse dia); nao protege de a fonte estar
  # errada, e a Metodologia diz isso por palavras. O registo curado e o
  # clipping entram sem esperar: sao ficheiros do repositorio, lidos
  # iguais em todas as rondas, e uma segunda ronda so os leria outra vez.
  rondas_para_confirmar: 2

sujeito:
  id: ventura
  nome: André Ventura
  # Deteccao por palavra inteira, sem acentos, nas fontes automaticas.
  detetar: [Ventura, André Ventura, Andre Ventura]

# Os nove canais medidos. O id e o que aparece nos dados; o nome e o que
# aparece no site. A cor de cada canal vive no CSS, com o mesmo id.
canais:
  - id: rtp1
    nome: RTP1
  - id: rtp2
    nome: RTP2
  - id: sic
    nome: SIC
  - id: tvi
    nome: TVI
  - id: sic-noticias
    nome: SIC Notícias
  - id: rtp3
    nome: RTP3
  - id: cnn-portugal
    nome: CNN Portugal
  - id: now
    nome: NOW
  - id: cmtv
    nome: CMTV

# Quando a fonte nao declara o programa, ele e deduzido do titulo: a
# parte antes do primeiro destes separadores, desde que nao seja o nome
# do sujeito. Os canais escrevem "Programa - Convidado - ep. N".
# O programa entra na chave que junta fragmentos da mesma emissao
# (canal, programa, dia), por isso deixa-lo vazio fazia duas emissoes
# diferentes do mesmo canal no mesmo dia colidirem numa so.
separadores_programa: [' - ', ' | ', ': ']

# Termos que, no TITULO de um item, o retiram do formato elegivel. Cada
# rejeicao fica na quarentena com o motivo. Afinar com a quarentena a
# vista, nunca as cegas.
exclusoes:
  debate: [debate, frente a frente, frente-a-frente, painel]
  declaracao: [declarações, declaracoes, reage, reação, reacao, à saída, a saida]
  direto: [em direto, comício, comicio, conferência de imprensa, conferencia de imprensa, discurso]

# Prova positiva de formato, exigida as fontes automaticas.
#
# Antes desta regra o formato de um item era `entrevista` por omissao e
# so os termos de exclusao acima o retiravam. Numa fonte automatica, em
# que ninguem leu a pagina, isso fazia contar como entrevista exclusiva
# qualquer peca com o nome do sujeito e com data, desde que
# o titulo nao dissesse debate, declaracoes ou direto. Verificado no
# dataset de 8 de setembro de 2026: sete pecas noticiosas curtas, uma de
# 55 segundos, estavam publicadas como entrevistas.
#
# A regra passa a ser a inversa: numa fonte automatica so conta o que o
# proprio canal chama entrevista. Ou o titulo contem um destes termos, ou
# o programa e um dos programas de entrevista abaixo. Tudo o resto vai
# para a quarentena como `formato_nao_apurado`, que e um motivo
# verdadeiro: nao se sabe o formato, e nao se publica o que nao se sabe.
#
# O registo curado nao passa por aqui: uma pessoa leu a pagina e decidiu.
# O clipping tambem nao, por outra razao: desde 2026-09-09 e gerado
# automaticamente, e a prova de formato dele e mais exigente do que esta,
# porque le o titulo e o lead da peca e exige ainda um canal nomeado e um
# dia fixado. Tambem nao passa uma fonte cuja configuracao ja
# declare `formato: entrevista` para o programa inteiro (um feed de um
# programa de entrevistas), porque essa declaracao e a decisao editorial.
prova_de_formato:
  # Por palavra inteira, sem acentos, so no titulo. A sinopse fala de
  # tudo e uma entrevista mencionada de passagem nao faz de uma peca
  # uma entrevista.
  termos: [entrevista, entrevistas, entrevistado, entrevistada]
  # Programas cujo formato e, por definicao, a entrevista a um so
  # convidado. Um episodio destes conta mesmo que o titulo nao diga a
  # palavra. Programas de magazine que tem entrevistas entre outras
  # coisas (manhas, tardes) nao estao aqui de proposito: um episodio
  # inteiro com o nome do sujeito nas etiquetas nao e uma entrevista, e
  # para esses o titulo tem de o dizer.
  programas: [Grande Entrevista, Alta Definição, Entrevista exclusiva]
