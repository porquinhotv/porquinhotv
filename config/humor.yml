---
# Humor do porquinho. Uma funcao dos dias desde a ultima entrevista.
#
# Este ficheiro e lido pelo site como docs/textos.json, gerado por
# ferramentas/gerar_textos.py. Ha um teste que falha se divergirem.
#
# Regra: cada frase tem no maximo um numero, que vem sempre dos dados.
# Isso inclui os numeros derivados: ver `metricas.temporada`, calculado a
# partir da contagem do periodo e nunca escrito a mao numa frase.
# As frases falam do porquinho, dos dias e dos canais. Nunca do que foi
# dito numa entrevista, e nunca a comentar a pessoa: a satira e sobre a
# frequencia das visitas, que e o que este site mede.
#
# O sujeito escreve-se sempre "o porquinho", nunca "ele": decisao do
# autor a 2026-09-11. Um pronome solto no site deixa de ser satira sobre
# a mascote e passa a apontar a uma pessoa, que e o que o projeto nao faz.
#
# `ate_dias` e o limite superior inclusivo de cada humor; o ultimo tem
# `ate_dias: null` e apanha o resto.

cabecalho:
  hoje: Hoje houve entrevista exclusiva.
  um_dia: Há 1 dia sem entrevista exclusiva.
  varios_dias: Há {dias} dias sem entrevista exclusiva.
  sem_dados: Ainda não há entrevistas registadas.
estado: O porquinho está {humor}.

humores:
  - id: euforico
    ate_dias: 1
    rotulo: eufórico
    frases:
      - Entrevista fresquinha. O porquinho rebola na lama e não se aguenta.
      - Ainda ontem. O porquinho já viu a repetição três vezes.
  - id: contente
    ate_dias: 3
    rotulo: contente
    frases:
      - '{dias} dias. Ainda se ouve o eco na sala.'
      - '{dias} dias. O porquinho guardou o telecomando debaixo da palha, por precaução.'
  - id: triste
    ate_dias: 6
    rotulo: triste
    frases:
      - '{dias} dias. O porquinho olha para o telecomando e suspira.'
      - '{dias} dias de silêncio. As moscas já andam devagar.'
      - '{dias} dias. O porquinho pergunta às moscas se a televisão ainda funciona.'
  - id: deprimido
    ate_dias: 13
    rotulo: deprimido
    frases:
      - '{dias} dias. Já se fala numa intervenção.'
      - '{dias} dias sem uma única entrevista exclusiva. Chove no chiqueiro.'
      - '{dias} dias. O porquinho deitou-se na lama e recusa-se a rebolar.'
  - id: hibernacao
    ate_dias: null
    rotulo: em hibernação
    frases:
      - '{dias} dias. O porquinho pergunta se a televisão foi desligada.'
      - '{dias} dias. Foi deitar-se. Acordem-no quando houver novidades.'
      - '{dias} dias. As moscas mudaram de chiqueiro. O porquinho não deu por nada.'

# Camada satirica das metricas. Nao muda nenhum numero: e texto ao lado
# do numero que vem do resumo.json.
#
# `total` e uma escada pelo numero de entrevistas do periodo escolhido,
# com a mesma forma dos humores: `ate` e o limite superior inclusivo e o
# ultimo degrau tem `ate: null`. Dentro de um degrau, a frase e escolhida
# pelo proprio numero, para nao mudar a cada refresh.
#
# As frases do total nao repetem o numero: ele esta escrito por cima, em
# corpo grande, e a frase e um comentario a esse numero.
#
# O nome de um canal nunca leva artigo escrito a mao: uns sao masculinos e
# outros femininos, e a frase tem de servir os nove.
#
# Placeholders permitidos, validados por ferramentas/gerar_textos.py:
# {n} e {temporada} no total, {n} e {canal} no lider, nenhum nas legendas.
metricas:
  total:
    - ate: 0
      frases:
        - Nada. O porquinho bateu no telecomando para ver se estava avariado.
    - ate: 1
      frases:
        - Uma. Já viu a entrevista, a repetição e o resumo.
    - ate: 3
      frases:
        - Ainda dá tempo para arrumar o chiqueiro entre uma e outra.
        - O porquinho chafurda de felicidade na lama!
    - ate: 9
      frases:
        - Isto já não é aparecer na televisão, é passar por casa.
        - O porquinho precisou de um caderno maior.
        - A esta altura já sabe onde ficam os camarins todos.
        - Há convidados e há inquilinos.
    - ate: null
      frases:
        - Isto já não é uma grelha de programação, é uma assinatura.
        - O porquinho desistiu de contar de cabeça.
        - Se fosse uma série, já ia na {temporada} temporada.
  # Quantos episodios tem uma temporada de uma serie, e o ordinal escrito
  # que corresponde a cada numero de temporada. Medida: uma temporada anda
  # entre 10 e 12 episodios; usamos 12 porque com o divisor maior o numero
  # de temporadas sai menor, e neste site ficar curto e preferivel a
  # inflacionar.
  #
  # Os ordinais sao indexados pelo numero da temporada. A primeira nao
  # esta aqui de proposito: "ja ia na primeira temporada" nao e piada
  # nenhuma. Acima da ultima chave tambem nao ha ordinal, e nos dois casos
  # a frase que precisa dele cede o lugar a outra do mesmo degrau, em vez
  # de escrever um numero que a configuracao nao tem.
  temporada:
    episodios: 12
    ordinais:
      2: segunda
      3: terceira
      4: quarta
      5: quinta
      6: sexta
      7: sétima
      8: oitava
      9: nona
      10: décima
      11: décima primeira
      12: décima segunda
  lider: '{canal}: {n}% das entrevistas. Já não é um canal, é uma segunda casa.'
  legendas:
    canais: Onde é que o porquinho apareceu mais vezes. Uma entrevista que passou em dois canais conta uma vez, no canal a que está atribuída, e a página de Fontes escreve ao lado qual foi o outro.
    evolucao: Cada barra é um período. Quanto mais alta, mais cheiro a estrume ficou no ar. Passe o rato ou use o teclado para ler os valores.
    recordes: O melhor e o pior do chiqueiro, em todo o histórico.
