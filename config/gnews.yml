---
# Colheita do indice do Google Noticias, por RSS, para reconstruir o
# historico. Corre em casa, uma vez. Nunca corre na CI.
#
# Porque existe: seis dos nove canais nao respondem a uma maquina de
# datacenter, ou montam a pesquisa por JavaScript. O Google Noticias
# indexa a imprensa toda, incluindo os sites dos canais, e a sua porta RSS
# responde sem conta, sem chave e sem JavaScript. E um detetor: diz que
# no dia X houve entrevista no canal Y. Nao e prova. A prova de cada
# linha continua a ser o URL do canal ou da peca que a colheita apontou.
#
# Sondado em 2026-09-08: a janela `after:2024-01-01 before:2024-02-01`
# devolveu 13 itens, todos de janeiro, um dos quais era uma entrevista
# real ja conhecida. A consulta solta apanha muito ruido e o RSS devolve
# no maximo cerca de 100 itens por consulta. Por isso ha varias consultas
# por janela, e a janela divide-se ao meio quando vem cheia.

# Como o RSS e pedido. Os parametros de regiao e lingua definem a edicao
# portuguesa do indice; sem eles a mesma consulta devolve outra coisa.
base: https://news.google.com/rss/search
parametros:
  hl: pt-PT
  gl: PT
  ceid: 'PT:pt-150'

# Varias consultas por janela, unidas e deduplicadas. Uma consulta nova
# junta-se aqui e a colheita repete-se so para ela: o estado guarda o que
# ja foi pedido por consulta e por janela, e uma corrida interrompida
# retoma onde ficou.
#
# Rendimento medido a 2026-09-09 com `--rendimento`, sobre 3202 linhas
# colhidas, 861 triadas e 45 provas publicadas. Tres coisas que a medicao
# mostrou, e que explicam a forma desta lista:
#
# 1. Uma consulta apertada nos mesmos termos de uma consulta larga que ja
#    correu NAO e redundante. O indice devolve uma amostra ordenada por
#    relevancia, nao o conjunto todo: a consulta com a frase feita esta
#    logicamente contida na consulta larga e mesmo assim trouxe 38 linhas
#    que nenhuma outra trouxe, e a que junta o nome de um canal trouxe
#    130. Cada consulta e uma amostra diferente do mesmo indice.
# 2. O que nao paga e repetir os mesmos termos noutra ordem. As duas
#    consultas que tinham os termos do programa de entrevistas trouxeram
#    260 e 263 linhas e so 1 e 4 exclusivas: eram a mesma amostra. Uma
#    saiu, e ha teste que impede que volte.
# 3. Uma consulta sem a palavra do formato converte mal. As consultas com
#    nome de programa retiveram 3% a 10% do que trouxeram; as que trazem
#    a palavra retiveram 27% a 55%. E o `agrupar` a fazer o que deve: sem
#    a palavra na consulta, so entra a linha que a tem no titulo. Por
#    isso as consultas de programa aparecem aqui outra vez, agora com a
#    palavra, sem que as antigas saiam: ja foram pedidas e nao custam
#    nada a manter.
consultas:
  # Consultas gerais. Apanham o que a imprensa e os canais titulam com a
  # palavra, que e a maioria das entrevistas recentes.
  - 'André Ventura entrevista'
  - '"André Ventura" "entrevista exclusiva"'
  - '"entrevista a André Ventura"'
  - '"André Ventura" entrevistado'
  # Formas da palavra. Medido: `entrevistado` foi a consulta que mais
  # linhas exclusivas poe na triagem, 129, e prova uma linha publicada que
  # mais nenhuma prova. Uma forma diferente da palavra e uma amostra
  # diferente; estas quatro nao tinham sido pedidas.
  - '"André Ventura" entrevistou'
  - '"André Ventura" entrevistas'
  - '"André Ventura" "deu uma entrevista"'
  - '"André Ventura" "numa entrevista"'
  # Consultas por canal. Amarrar a consulta ao nome do canal apanha os
  # titulos que dizem "em entrevista a X" sem que a peca seja do proprio
  # canal. Medido: entre 28 e 162 linhas exclusivas cada.
  - '"André Ventura" entrevista RTP'
  - '"André Ventura" entrevista SIC'
  - '"André Ventura" entrevista TVI'
  - '"André Ventura" entrevista CNN'
  - '"André Ventura" entrevista CMTV'
  - '"André Ventura" entrevista NOW'
  # As marcas por extenso e os leitores. O indice trata cada uma como um
  # termo proprio, e nenhuma delas tinha sido pedida: uma peca que so
  # escreve o nome comprido do canal nao entra por nenhuma das de cima.
  - '"André Ventura" entrevista "SIC Notícias"'
  - '"André Ventura" entrevista "CNN Portugal"'
  - '"André Ventura" entrevista "RTP Play"'
  - '"André Ventura" entrevista "TVI Player"'
  - '"André Ventura" entrevista TVI24'
  - '"André Ventura" entrevista "Correio da Manhã"'
  # Consultas por programa e por entrevistador. Um canal titula o
  # episodio pelo nome do programa e deixa o convidado so na sinopse, que
  # o indice nao traz; sem estas, essas entrevistas nunca aparecem. Medido:
  # convertem mal sozinhas, mas a do noticiario da noite prova duas
  # linhas publicadas que mais nenhuma consulta prova.
  - '"Grande Entrevista" "André Ventura"'
  - '"Jornal Nacional" "André Ventura"'
  - '"Jornal da Noite" "André Ventura"'
  - '"Grande Jornal" "André Ventura"'
  - 'Goucha "André Ventura"'
  - '"Dois às 10" "André Ventura"'
  - '"Alta Definição" "André Ventura"'
  - '"Casa Feliz" "André Ventura"'
  # As mesmas com a palavra do formato, pela razao 3 acima, mais quatro
  # programas que nunca foram pedidos.
  - '"Grande Entrevista" "André Ventura" entrevista exclusiva'
  - '"Jornal Nacional" "André Ventura" entrevista'
  - '"Jornal da Noite" "André Ventura" entrevista'
  - '"Grande Jornal" "André Ventura" entrevista'
  - 'Goucha "André Ventura" entrevista'
  - '"Dois às 10" "André Ventura" entrevista'
  - '"Alta Definição" "André Ventura" entrevista'
  - '"Casa Feliz" "André Ventura" entrevista'
  - '"Jornal das 8" "André Ventura" entrevista'
  - '"Diário da Manhã" "André Ventura" entrevista'
  - '"Olá, Bom Dia" "André Ventura" entrevista'
  - '"Bom Dia Portugal" "André Ventura" entrevista'

# Janela de um mes. Quando uma consulta numa janela devolve `limiar_divisao`
# itens ou mais, esta a bater no teto do RSS e a janela e dividida em duas
# ate caber. Cada janela pede-se com um dia de folga de cada lado, porque
# nao esta documentado se `after:` e `before:` incluem ou excluem o dia;
# a deduplicacao trata das sobreposicoes.
limiar_divisao: 90
pausa_s: 6

# Colheita dirigida pela lista de referencia (config/referencia.yml).
# Por cada linha da lista pede-se uma janela curta, de `folga_antes` dias
# antes a `folga_depois` dias depois da entrevista, mais o dia de folga que
# `url_da_consulta` ja poe de cada lado. Uma peca anuncia a entrevista na
# vespera e relata-a no dia seguinte ou dois depois; tres dias depois
# cobre o relato de segunda-feira de uma entrevista de sexta.
#
# Porque paga: o indice devolve uma amostra ordenada por relevancia, nao
# o conjunto todo, e numa janela de sete dias com o nome do canal a
# amostra e pequena e a peca certa tem mais hipotese de vir. As
# consultas gerais correm para todas as linhas; as do canal so para as
# linhas desse canal. Custo estimado, nao medido: 52 linhas vezes duas
# consultas, cerca de 100 pedidos a 6 s, dez minutos.
dirigidas:
  folga_antes: 2
  folga_depois: 3
  consultas_gerais:
    - '"André Ventura" entrevista'
  consultas_por_canal:
    rtp1: ['"André Ventura" entrevista RTP']
    rtp2: ['"André Ventura" entrevista RTP']
    rtp3: ['"André Ventura" entrevista RTP']
    sic: ['"André Ventura" entrevista SIC']
    sic-noticias: ['"André Ventura" entrevista SIC']
    tvi: ['"André Ventura" entrevista TVI']
    cnn-portugal: ['"André Ventura" entrevista CNN']
    now: ['"André Ventura" entrevista NOW']
    cmtv: ['"André Ventura" entrevista CMTV']

# Pausa da resolucao das ligacoes. E mais baixa do que a da colheita
# porque a resolucao so corre sobre os candidatos triados, que sao
# poucas centenas, e nao sobre a colheita inteira.
pausa_resolucao_s: 2

# Pausa por dominio, em segundos, para quando o proprio sitio diz o ritmo
# que quer. Sobrepoe-se a `pausa_resolucao_s`.
#
# Verificado a 2026-09-09: o `robots.txt` do jornal de verificacao pede
# `Crawl-Delay: 300`. Nao ha bloqueio nenhum, as paginas respondem a
# qualquer ritmo; o numero e o que o sitio pede e o projeto respeita-o,
# pela mesma razao por que ja recusou uma fonte cujo `robots.txt` bloqueia
# maquinas. O custo esta assumido: uma corrida sobre este dominio passa a
# medir-se em horas.
pausa_por_dominio:
  poligrafo.sapo.pt: 300

# Mapas de sitio, para chegar as pecas pela porta da frente.
#
# Verificado a 2026-09-09: o indice deste jornal declara 13 mapas de
# verificacoes, com cerca de 12.100 enderecos. No mais antigo, 10 em 1001
# nomeiam o sujeito no proprio endereco; no mais recente, 3 em 117. Sao 1%
# e 2,6%, o que aponta para 120 a 315 pecas no arquivo todo.
#
# O que o mapa da e um endereco, mais nada: nem titulo, nem data, nem
# lead. Por isso estas linhas entram direitas na triagem, ja com a prova
# resolvida, e e o `--verificar` que vai buscar o resto, com o mesmo
# extrator e as mesmas quatro condicoes de qualquer outra peca.
#
# Limitacao conhecida: filtrar pelo endereco perde as verificacoes cujo
# endereco nao nomeia o sujeito. As nove pecas deste jornal que ja provam
# linhas publicadas nomeiam-no todas, mas nove casos nao dizem nada sobre
# 12.100.
mapas:
  - nome: Polígrafo
    indice: https://poligrafo.sapo.pt/sitemap_index.xml
    # So as verificacoes. O mapa de artigos (`post-sitemap`) foi medido a
    # 2026-09-09 e deu zero em 21: sao debates, discursos e pecas sobre
    # redes sociais, nenhuma prova uma entrevista.
    prefixos: [fact_check-sitemap]

# Separadores que separam o nome do programa do resto do titulo. Os
# mesmos de config/porquinho.yml, repetidos aqui porque esta ferramenta
# corre fora da recolha.
separadores_programa: [' - ', ' | ', ': ']

# Deteccao de canal no nome da fonte, no dominio da fonte e no titulo.
# Vive aqui e nao no codigo: nenhum modulo Python conhece um canal.
# Os dois sites do grupo Media Capital publicam os mesmos videos um no
# outro, por isso a coluna do titulo vale mais do que a da fonte.
canais_por_texto:
  rtp1: [RTP1, RTP 1]
  rtp2: [RTP2, RTP 2]
  rtp3: [RTP3, RTP 3, RTP Notícias, RTP Noticias]
  sic: [SIC]
  sic-noticias: [SIC Notícias, SIC Noticias]
  tvi: [TVI]
  cnn-portugal: [CNN Portugal, CNN]
  now: [NOW, canal NOW]
  cmtv: [CMTV]
# Dominios que servem como prova. O grupo Media Capital serve os mesmos
# videos em varios dominios, e o leitor (`tviplayer`) e um deles: sem o
# declarar, uma prova legitima era recusada como imprensa.
#
# Atencao ao `rtp.pt`: serve os tres canais da RTP e a pagina do Play
# declara "RTP Notícias", que e a RTP3. Quando a entrevista tambem passou na
# RTP1, o canal escreve-se a mao na coluna `canal` da triagem; o dominio
# so decide quando ninguem decidiu.
canais_por_dominio:
  rtp3: [rtp.pt]
  sic: [sic.pt]
  sic-noticias: [sicnoticias.pt]
  tvi: [tvi.iol.pt, tviplayer.iol.pt]
  cnn-portugal: [cnnportugal.iol.pt]
  now: [nowcanal.pt]
  cmtv: [cmjornal.pt, cmtv.pt]

# Palavras no titulo que indicam formato. So indicam: a triagem e feita
# por uma pessoa, com a pagina do canal aberta.
marcadores_formato:
  entrevista: [entrevista, entrevistado, entrevistada, entrevistas]
  debate: [debate, frente a frente, frente-a-frente]
  declaracao: [declarações, declaracoes, reage, reação, reacao]

# Prova de imprensa (`--emitir --imprensa`). Uma peca de um jornal prova
# que a entrevista existiu e em que dia, e mais nada: nao prova a
# duracao. Vai para config/clipping.yml, que o coletor le com `origem:
# imprensa`, e o site mostra a origem ao lado de cada linha. As regras
# aqui sao as que qualquer pessoa verifica abrindo a peca; cada recusa
# fica escrita com o motivo no ecra.
#
# Todas as listas casam por palavra inteira e sem acentos, por isso basta
# uma forma de cada termo.
imprensa:
  # Verbos de relato. Uma peca que relata a entrevista escreve "esteve",
  # "disse", "garantiu"; uma que a anuncia escreve "vai estar", "dara",
  # "sera as 20h". Sem um verbo destes a peca nao esta a relatar nada e a
  # linha espera por uma pessoa. "Esta" nao entra de proposito: sem
  # acentos e igual ao demonstrativo de "esta segunda-feira".
  relato: [esteve, disse, afirmou, afirma, garante, garantiu, considerou, considera,
           defendeu, defende, revelou, revela, admite, admitiu, acusa, acusou, diz,
           critica, criticou, justifica, justificou, respondeu, responde, recusa, recusou,
           deu, concedeu, falou, fala, reconhece, reconheceu, lamenta, lamentou]
  # Marcas de anuncio. Uma peca com uma destas fala de uma entrevista que
  # ainda nao tinha acontecido quando foi escrita. Conta desde 2026-09-09,
  # por decisao do autor: uma entrevista anunciada a um canal raramente se
  # cancela ou adia. A marca decide para que lado se le um dia da semana:
  # "nao perca esta segunda-feira" e a que vem, "esteve esta segunda-feira"
  # e a que passou. Uma pessoa pode sempre corrigir em `data_entrevista`.
  anuncio: [vai estar, vai dar, dará, dá hoje, não perca, hora marcada, na próxima, será às, sera as, será transmitida]
  # Como a peca fixa o dia, lido contra a data de publicacao. A ordem de
  # leitura e esta: ontem, amanha, dia da semana, hoje.
  # Meses, para reconhecer uma data escrita por extenso. Um mes seguido
  # de ano na frase da entrevista data-a noutro periodo e tira a leitura
  # do dia relativo. Um ano sozinho nao chega: "revogado em 2005" apareceu
  # a 366 caracteres da mencao da entrevista, numa peca que dizia bem o
  # dia, e cortava uma linha certa.
  meses: [janeiro, fevereiro, março, abril, maio, junho, julho, agosto,
          setembro, outubro, novembro, dezembro]
  # Distancia, em caracteres, a que um ano sozinho ainda data a
  # entrevista. Medido nas pecas reais: as que datam a entrevista tem o
  # ano a 32 e a 93 caracteres da palavra; a que a data bem tem-no a 366.
  janela_do_ano: 60
  ontem: [ontem, na noite de ontem, ontem à noite]
  amanha: [amanhã, amanhã à noite]
  # "em direto" e "agora" sairam a 2026-09-09: dizem como a entrevista passou,
  # nao quando a peca foi escrita. Uma peca sobre uma entrevista abandonada
  # "em direto" entrou com a data da peca, que era o dia seguinte.
  hoje: [hoje, esta noite, esta tarde, esta manhã]
  # Dia da semana: numa peca que relata e o mais recente com esse nome ate
  # ao dia da publicacao, inclusive ("esteve esta segunda-feira" numa peca
  # de terca e a vespera); numa peca que anuncia e o proximo, tambem
  # inclusive. Sem verbo de relato nem marca de anuncio nao se le, porque
  # errar o lado e errar uma semana. Indice como o de Python, segunda a
  # zero.
  dias_da_semana:
    segunda-feira: 0
    terça-feira: 1
    quarta-feira: 2
    quinta-feira: 3
    sexta-feira: 4
    sábado: 5
    domingo: 6
